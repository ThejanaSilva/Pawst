name: pawst_app
description: A social media app for pets (Pawst!)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  provider: ^6.0.5
  image_picker: ^0.8.7+4
  # video_player removed as it is not used in the codebase
  # video_player: ^2.6.1
  # New dependencies for Events & Meetups feature
  # google_maps_flutter removed – replaced by flutter_map (OpenStreetMap)
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  flutter_typeahead: ^5.2.0
  intl: ^0.18.0
  geocoding: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - Pawst/assets/
